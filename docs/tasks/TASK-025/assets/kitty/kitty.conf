# Sekai Pop themed Kitty (ALW, TASK-025)
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
font_size        12.0
adjust_line_height 110%

background       #2a293d
background_opacity 0.88
foreground       #d9fff6
cursor           #04feee
cursor_text_color #2a293d
selection_background #555473
selection_foreground #d9fff6
url_color        #04feee

# Sekai Pop palette (Blapples/SekaiPop)
color0  #2a293d
color8  #555473
color1  #ff6b9d
color9  #ff86b0
color2  #00ffcb
color10 #6dffe3
color3  #ffd166
color11 #ffe4a3
color4  #04feee
color12 #7df6ff
color5  #b58cff
color13 #d0b6ff
color6  #5ce1e6
color14 #a6f1f5
color7  #d9fff6
color15 #ffffff

window_padding_width 14
hide_window_decorations yes
confirm_os_window_close 0

tab_bar_style powerline
tab_powerline_style round
active_tab_background #04feee
active_tab_foreground #2a293d
inactive_tab_background #555473
inactive_tab_foreground #d9fff6

# Smooth, VSync-aligned repaints for the nested Wayland session
repaint_delay 8
input_delay 2
sync_to_monitor yes

# Clipboard & Shortcut mappings
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+c copy_and_clear_or_interrupt
map ctrl+v paste_from_clipboard

